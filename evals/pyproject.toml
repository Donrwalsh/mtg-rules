[project]
name = "mtg-evals"
version = "0.1.0"
description = "Eval harness: runs eval.yaml against the running mtg-api and diffs against a baseline."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.16.4",  # pinned: CI lint must not drift with new releases
]

[project.scripts]
mtg-evals = "mtg_evals.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_evals"]

[tool.ruff]
line-length = 100
target-version = "py312"
