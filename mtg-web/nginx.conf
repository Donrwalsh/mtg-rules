# Behind Coolify's Traefik $scheme is always http; pass on the scheme the
# client actually used.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Basic auth for the whole site when MTG_WEB_AUTH_PASSWORD is set
    # (written by 40-basic-auth.sh at container start; empty otherwise).
    # The SPA's /api calls are same-origin, so the browser sends the
    # credentials with them too.
    include /etc/nginx/auth.conf;

    # The SPA calls /api on its own origin; forward it to the backend.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Answer generation can take up to MTG_API_GEMINI_TIMEOUT_SECONDS (60).
        proxy_read_timeout 90s;
    }

    # Open for uptime monitoring; it reveals nothing.
    location = /health {
        auth_basic off;
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
