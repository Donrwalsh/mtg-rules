[project]
name = "mtg-ingestion"
version = "0.1.0"
description = "Fetches and parses the MTG Comprehensive Rules, Scryfall oracle card text, and Scryfall rulings."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
mtg-ingest = "mtg_ingestion.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_ingestion"]

[tool.ruff]
line-length = 100
target-version = "py312"
