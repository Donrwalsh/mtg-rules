[project]
name = "mtg-worker"
version = "0.1.0"
description = "Celery worker running the MTG ingestion and embedding pipelines, triggered from mtg-api."
requires-python = ">=3.12"
dependencies = [
    "celery>=5.3",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.16.4",  # pinned: CI lint must not drift with new releases
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_worker"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# Only this package's tests: mtg-ingestion/ and mtg-embed/ have their own
# suites, whose module names collide with these.
testpaths = ["tests"]
