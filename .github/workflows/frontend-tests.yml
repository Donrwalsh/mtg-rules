name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mtg-web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Same major version as the Dockerfile's builder stage.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: mtg-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Coolify builds this Dockerfile on deploy; catch a broken build here.
      - name: Build image
        run: docker build .
