name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Test and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mtg-web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Same major version as the Dockerfile's builder stage.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: mtg-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm test

      # `install` skips the download when the cached browser matches.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('mtg-web/package-lock.json') }}

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: mtg-web/playwright-report
          retention-days: 7

      - name: Build
        run: npm run build

      # Coolify builds this Dockerfile on deploy; catch a broken build here.
      - name: Build image
        run: docker build .
