name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Lint, Build, and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mtg-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            mtg-api/requirements.lock
            mtg-api/pyproject.toml

      # The pinned lock is what the Docker image installs.
      - name: Install dependencies
        run: pip install -r requirements.lock -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: pytest

      # Coolify builds this Dockerfile on deploy; catch a broken build here.
      - name: Build image
        run: docker build .
