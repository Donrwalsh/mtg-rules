# ─────────────────────────── MESSY INPUT (6) ───────────────────────────

- id: messy-slang-bolt-hexproof
  question: can i bolt my own hexproof guy
  tags: [messy, slang, hexproof]
  split: dev
  required_sources:
    rules: ["702.11b"]
  gold_answer: Yes. Hexproof only stops opponents from targeting it.
  verdict: yes

- id: messy-lowercase-cards
  question: does rest in peace stop blood artist from triggering
  tags: [messy, lowercase, card-match, interaction]
  split: dev
  required_sources:
    rulings: ["Rest in Peace"]
  expected_cards: ["Rest in Peace", "Blood Artist"]
  forbidden_cards: ["Blood"]
  gold_answer: Yes. Creatures are exiled instead of dying, so Blood Artist never triggers.
  verdict: yes

- id: messy-misspelled-card
  question: What happens when I Lightening Bolt a planeswalker?
  tags: [messy, misspelling, planeswalker]
  split: test
  required_sources:
    rules: ["120.3c"]
  forbidden_cards: ["Lightning"]
  gold_answer: Lightning Bolt can target a planeswalker; the 3 damage removes 3 loyalty counters, and it dies at 0 loyalty.

- id: messy-misspelled-keyword
  question: wrath of god vs indestructable creature, does it survive?
  tags: [messy, misspelling, indestructible, card-match]
  split: dev
  required_sources:
    rules: ["702.12b"]
  expected_cards: ["Wrath of God"]
  gold_answer: Yes. Indestructible creatures can't be destroyed, so Wrath of God doesn't kill it.
  verdict: yes

- id: messy-terse-hand-size
  question: max hand size?
  tags: [messy, terse]
  split: dev
  required_sources:
    rules: ["402.2"]
  gold_answer: Seven, normally. Extra cards are discarded during your cleanup step.

- id: messy-mulligan
  question: how do mulligans work these days
  tags: [messy, casual, game-start]
  split: test
  required_sources:
    rules: ["103.5"]
  gold_answer: Shuffle your hand back, draw seven again, then put one card on the bottom for each mulligan you've taken. You can keep going until your hand would be zero cards.
